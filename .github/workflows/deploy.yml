name: Deploy to Hostinger

on:
  push:
    branches:
      - dev  # Triggers on push to dev branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: 📦 Install dependencies
        run: npm ci
      
      # Step 4: Build application
      - name: 🔨 Build application
        run: npm run build
      
      # Step 5: Copy .htaccess to dist
      - name: 📄 Add .htaccess
        run: cp .htaccess dist/.htaccess
      
      # Step 6: Deploy to Hostinger via FTP
      - name: 🚀 Deploy to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "
          set ftp:ssl-allow no;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          mirror -Rev ./dist /public_html --ignore-time --parallel=10 --verbose;
          bye
          "
      
      # Step 7: Deployment success notification
      - name: ✅ Deployment complete
        run: |
          echo "🎉 Deployment successful!"
          echo "🌐 Your website has been updated at your domain"
