name: Deploy to Hostinger

on:
  push:
    branches:
      - dev  # Triggers on push to dev branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: 📦 Install dependencies
        run: npm ci
      
      # Step 4: Build application
      - name: 🔨 Build application
        run: npm run build
      
      # Step 5: Copy .htaccess to dist
      - name: 📄 Add .htaccess
        run: cp .htaccess dist/.htaccess
      
      # Step 6: Deploy to Hostinger via FTP
      - name: 🚀 Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: true  # Clears old files before uploading
      
      # Step 7: Deployment success notification
      - name: ✅ Deployment complete
        run: |
          echo "🎉 Deployment successful!"
          echo "🌐 Your website has been updated at your domain"
