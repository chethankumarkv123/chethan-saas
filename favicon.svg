<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />
  
  <!-- Inner Glass Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Main Icon (Layered Document & Lightning/Code) -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Layered Document Shape -->
    <path d="M20 14h16l12 12v22a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z" fill="#ffffff" opacity="0.95"/>
    <path d="M36 14v10a2 2 0 0 0 2 2h10" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Code / Bolt Symbol in Document Center -->
    <path d="M26 31l-4 4 4 4" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 31l4 4-4 4" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M33 29l-3 8" fill="none" stroke="#0070f3" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>